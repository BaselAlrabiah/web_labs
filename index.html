<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Header Color</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1 id="heading">Hello, choose a color!</h1>

    <form id="color-form">
        <input type="text" id="color-input" placeholder="e.g. red or #00aa88" autocomplete="off">
        <button type="submit">Change Color</button>
    </form>

    <p id="message"></p>
</body>
</html>
